<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CashCach · Admin Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #6c3fc5;
      --accent-l: #8b5cf6;
      --bg: #f0f2f5;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1a1a2e;
      --muted: #64748b;
      --red: #dc2626;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(108,63,197,.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #1e1040, var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .logo-text { font-size: 22px; font-weight: 900; color: var(--text); }
    .logo-sub  { font-size: 12px; color: var(--muted); font-weight: 500; }

    h2 {
      font-size: 20px; font-weight: 800; color: var(--text);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px; color: var(--muted); margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px; color: var(--text);
      font-family: 'Inter', sans-serif;
      outline: none; transition: border-color .2s;
      background: #fafafa;
    }
    input:focus { border-color: var(--accent); background: #fff; }

    .btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 800;
      cursor: pointer; margin-top: 8px;
      transition: filter .15s, transform .1s;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover  { filter: brightness(1.08); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .error {
      display: none;
      background: #fef2f2; border: 1px solid #fecaca;
      color: var(--red); border-radius: 10px;
      padding: 10px 14px; font-size: 13px; font-weight: 600;
      margin-top: 14px;
    }
    .error.show { display: block; }

    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pwd-wrap { position: relative; }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 16px; padding: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">💰</div>
      <div>
        <div class="logo-text">CashCach</div>
        <div class="logo-sub">Panel de Administración</div>
      </div>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="subtitle">Ingresa con tu cuenta de administrador</p>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="admin@ejemplo.com" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <div class="pwd-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="pwd-toggle" onclick="togglePwd()" tabindex="-1" id="pwd-eye">👁</button>
      </div>
    </div>

    <button class="btn" id="btn-login" onclick="login()">Entrar al panel</button>
    <div class="error" id="error-msg"></div>
  </div>

<script>
  const SUPABASE_URL = 'https://mvbkyducdlajoexawbqk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Ymt5ZHVjZGxham9leGF3YnFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NjAyNTgsImV4cCI6MjA5MjEzNjI1OH0.-kSTyl1KhfAa9N13PjOObwWz1Gi83KT3_6TeyTY7LlY';
  const { createClient } = supabase;
  const auth = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Si ya hay sesión activa, redirigir directo al admin
  auth.auth.getSession().then(({ data }) => {
    if (data.session) location.replace('./index.html');
  });

  // Enter en contraseña hace login
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function login() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errEl    = document.getElementById('error-msg');

    errEl.classList.remove('show');

    if (!email || !password) {
      errEl.textContent = 'Completa el correo y la contraseña.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Verificando…';

    const { error } = await auth.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Entrar al panel';
      errEl.textContent = error.message.includes('Invalid login')
        ? 'Correo o contraseña incorrectos.'
        : error.message;
      errEl.classList.add('show');
    } else {
      location.replace('./index.html');
    }
  }

  function togglePwd() {
    const input = document.getElementById('password');
    const eye   = document.getElementById('pwd-eye');
    if (input.type === 'password') { input.type = 'text';     eye.textContent = '🙈'; }
    else                           { input.type = 'password'; eye.textContent = '👁';  }
  }
</script>
</body>
</html>
