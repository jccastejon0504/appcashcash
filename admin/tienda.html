<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CashCach · Tienda</title>
  <meta id="og-title"       property="og:title"       content="Tienda en CashCach" />
  <meta id="og-description" property="og:description" content="Descubre esta tienda en CashCach" />
  <meta id="og-image"       property="og:image"       content="" />
  <meta property="og:type"  content="website" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:   #6c3fc5;
      --accent-l: #8b5cf6;
      --bg:       #f7f8fa;
      --card:     #ffffff;
      --border:   #eaecf0;
      --text:     #111827;
      --muted:    #6b7280;
      --muted2:   #9ca3af;
      --green:    #059669;
      --wa:       #25D366;
      --r:        16px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* ── TOPBAR ─────────────────────────────────── */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .topbar-name { font-size: 17px; font-weight: 800; color: var(--text); }
    .topbar-sub  { font-size: 11px; color: var(--muted); }
    .topbar-badge {
      margin-left: auto; background: #fef3c7; color: #92400e;
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 20px; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }

    /* ── HERO ───────────────────────────────────── */
    .hero {
      position: relative; width: 100%; height: 320px;
      overflow: hidden; background: #1e1040;
    }
    @media (min-width: 600px) { .hero { height: 420px; } }
    .hero-img { width: 100%; height: 100%; object-fit: cover; }
    .hero-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e1040 0%, #6c3fc5 100%);
      font-size: 80px;
    }
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.05) 0%, rgba(0,0,0,.65) 100%);
    }
    .hero-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 20px 20px;
    }
    .hero-nombre {
      font-size: 28px; font-weight: 900; color: #fff;
      line-height: 1.2; margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,.4);
    }
    @media (min-width: 600px) { .hero-nombre { font-size: 36px; } }
    .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .hero-tag {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: #fff; font-weight: 600;
    }
    .hero-tag-dest {
      background: rgba(245,158,11,.85);
      border-color: rgba(245,158,11,.5);
    }

    /* ── LAYOUT ─────────────────────────────────── */
    .layout {
      max-width: 960px; margin: 0 auto;
      padding: 20px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 720px) {
      .layout {
        grid-template-columns: 280px 1fr;
        align-items: start;
      }
    }

    /* ── SIDEBAR ────────────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 14px; }

    /* ── CARD ───────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .card-head {
      padding: 14px 16px 0;
      font-size: 10px; font-weight: 800;
      color: var(--muted2); letter-spacing: 1.2px; text-transform: uppercase;
    }
    .card-body { padding: 12px 16px 16px; }

    /* ── CONTACTO ───────────────────────────────── */
    .btns-contacto { display: flex; flex-direction: column; gap: 8px; }
    .btn-c {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 16px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      text-decoration: none; transition: filter .15s, transform .1s;
    }
    .btn-c:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-c:active { transform: translateY(0); }
    .btn-wa  { background: linear-gradient(135deg, #25D366, #1aaf53); }
    .btn-tel { background: linear-gradient(135deg, #059669, #047857); }
    .btn-web { background: linear-gradient(135deg, var(--accent), var(--accent-l)); }

    /* ── INFO ROWS ──────────────────────────────── */
    .info-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .info-label { font-size: 10px; color: var(--muted2); font-weight: 600; margin-bottom: 1px; }
    .info-val { font-size: 13px; color: var(--text); font-weight: 500; }

    /* ── DESCRIPCIÓN ────────────────────────────── */
    .desc-text {
      font-size: 14px; color: #374151; line-height: 1.7;
    }

    /* ── MAIN ───────────────────────────────────── */
    .main { display: flex; flex-direction: column; gap: 16px; }

    /* ── SECCIÓN TÍTULO ─────────────────────────── */
    .sec-titulo {
      font-size: 18px; font-weight: 800; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .sec-titulo-line {
      flex: 1; height: 2px;
      background: linear-gradient(to right, var(--border), transparent);
    }

    /* ── GALERÍA ────────────────────────────────── */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 480px) { .galeria-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 720px) { .galeria-grid { grid-template-columns: repeat(3, 1fr); } }

    .prod-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .prod-card:hover {
      box-shadow: 0 12px 32px rgba(108,63,197,.15);
      transform: translateY(-3px);
    }
    .prod-img-wrap { position: relative; overflow: hidden; aspect-ratio: 1; }
    .prod-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .3s;
    }
    .prod-card:hover .prod-img { transform: scale(1.05); }
    .prod-placeholder {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      font-size: 40px;
    }
    .prod-badge-imgs {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,.5); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }
    .prod-info { padding: 10px 12px 14px; }
    .prod-nombre {
      font-size: 13px; font-weight: 700; color: var(--text);
      line-height: 1.4; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .prod-precio {
      font-size: 18px; font-weight: 900;
      color: var(--accent); line-height: 1;
    }
    .prod-precio-bs {
      font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 500;
    }
    .prod-sin-precio {
      font-size: 12px; color: var(--muted2); font-style: italic;
    }

    /* ── MODAL PRODUCTO ─────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    @media (min-width: 540px) { .overlay { align-items: center; } }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%; max-width: 520px;
      max-height: 92vh; overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @media (min-width: 540px) { .modal { border-radius: 24px; } }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    .modal-handle {
      width: 40px; height: 4px; background: #e5e7eb;
      border-radius: 4px; margin: 12px auto 0;
    }
    @media (min-width: 540px) { .modal-handle { display: none; } }

    .modal-img-wrap { position: relative; }
    .modal-img-main {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      background: var(--bg);
    }
    .modal-cerrar {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.45); border: none;
      width: 34px; height: 34px; border-radius: 50%;
      color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-thumbs {
      display: flex; gap: 8px; padding: 10px 16px;
      overflow-x: auto; background: #f9fafb;
      border-bottom: 1px solid var(--border);
    }
    .modal-thumb {
      width: 58px; height: 58px; object-fit: cover;
      border-radius: 10px; cursor: pointer; flex-shrink: 0;
      border: 2.5px solid transparent; transition: border-color .15s;
    }
    .modal-thumb.on { border-color: var(--accent); }
    .modal-body { padding: 18px 18px 24px; }
    .modal-nombre { font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .modal-precios { margin-bottom: 14px; }
    .modal-precio { font-size: 28px; font-weight: 900; color: var(--accent); }
    .modal-precio-bs { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .modal-sep { height: 1px; background: var(--border); margin: 14px 0; }
    .modal-desc { font-size: 14px; color: #374151; line-height: 1.7; }
    .modal-wa {
      margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn-wa-modal {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: linear-gradient(135deg, #25D366, #1aaf53);
      color: #fff; border: none; border-radius: 14px;
      padding: 15px; font-size: 15px; font-weight: 800;
      cursor: pointer; text-decoration: none;
      transition: filter .15s;
    }
    .btn-wa-modal:hover { filter: brightness(1.07); }
    .modal-nota {
      text-align: center; font-size: 11px; color: var(--muted2);
    }

    /* ── BTN INFO TOPBAR ────────────────────────── */
    .btn-info {
      margin-left: auto; background: none; border: none;
      cursor: pointer; padding: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 22px; flex-shrink: 0;
      transition: color .15s;
    }
    .btn-info:hover { color: var(--accent); }

    /* ── MODAL INFO TIENDA ──────────────────────── */
    .info-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 400;
      align-items: flex-end; justify-content: center;
    }
    .info-overlay.open { display: flex; }
    .info-sheet {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%; max-width: 520px;
      max-height: 85vh; overflow-y: auto;
      animation: slideUp .25s ease;
      padding: 0 0 36px;
    }
    @media (min-width: 540px) {
      .info-overlay { align-items: center; }
      .info-sheet { border-radius: 24px; max-height: 80vh; }
    }
    .info-sheet-handle {
      width: 40px; height: 4px; background: #e5e7eb;
      border-radius: 4px; margin: 14px auto 0;
    }
    @media (min-width: 540px) { .info-sheet-handle { display: none; } }
    .info-sheet-header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .info-sheet-title {
      flex: 1; font-size: 18px; font-weight: 800; color: var(--text);
    }
    .info-sheet-close {
      background: #f3f4f6; border: none; border-radius: 50%;
      width: 32px; height: 32px; cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: background .15s;
    }
    .info-sheet-close:hover { background: #e5e7eb; }
    .info-sheet-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
    .info-sec-label {
      font-size: 10px; font-weight: 800; color: var(--muted2);
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px;
    }
    .info-sheet-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .info-sheet-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-sheet-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .info-sheet-lbl { font-size: 10px; color: var(--muted2); font-weight: 600; margin-bottom: 2px; }
    .info-sheet-val { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.5; }
    .info-sheet-desc { font-size: 14px; color: #374151; line-height: 1.7; }
    .info-sheet-btns { display: flex; flex-direction: column; gap: 8px; }
    .info-sheet-sep { height: 1px; background: var(--border); }
    .btn-maps {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 16px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      text-decoration: none; background: linear-gradient(135deg, #ea4335, #c5221f);
      transition: filter .15s;
    }
    .btn-maps:hover { filter: brightness(1.08); }

    /* ── BANNER DESCARGA ────────────────────────── */
    .banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 24px rgba(0,0,0,.1);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      z-index: 100;
    }
    .banner-logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #1e1040, var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .banner-txt { flex: 1; min-width: 0; }
    .banner-t1 { font-size: 13px; font-weight: 800; color: var(--text); }
    .banner-t2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .banner-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .banner-btn {
      padding: 9px 13px; border-radius: 10px; border: none;
      font-size: 11px; font-weight: 800; cursor: pointer;
      text-decoration: none; display: inline-block; white-space: nowrap;
    }
    .banner-btn-android { background: linear-gradient(135deg, var(--accent), var(--accent-l)); color: #fff; }
    .banner-btn-ios     { background: #111827; color: #fff; }

    /* ── ESTADO ─────────────────────────────────── */
    .estado {
      min-height: 50vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); text-align: center;
      padding: 24px;
    }
    .estado-icono { font-size: 56px; }
    .estado-titulo { font-size: 18px; font-weight: 700; color: var(--text); }
    .estado-sub { font-size: 14px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ────────────────────────────── */
    .empty-galeria {
      text-align: center; padding: 40px 20px;
      color: var(--muted2); font-size: 14px;
    }

    /* scrollbar mínima */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<!-- Loading state inicial -->
<div id="loading" class="estado" style="min-height:100vh">
  <div class="spinner"></div>
  <div class="estado-sub">Cargando tienda…</div>
</div>

<!-- Página principal (oculta hasta cargar) -->
<div id="pagina" style="display:none">

  <!-- Topbar -->
  <div class="topbar" id="topbar">
    <div class="topbar-logo">💰</div>
    <div>
      <div class="topbar-name" id="top-nombre">—</div>
      <div class="topbar-sub">CashCach · Directorio de Tiendas</div>
    </div>
    <div id="top-dest" class="topbar-badge" style="display:none">⭐ Destacada</div>
    <button class="btn-info" id="btn-info" onclick="abrirInfo()" style="display:none" title="Información de la tienda">ℹ️</button>
  </div>

  <!-- Hero -->
  <div class="hero" id="hero"></div>

  <!-- Layout -->
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">

      <!-- Contacto -->
      <div class="card" id="card-contacto" style="display:none">
        <div class="card-head">Contactar</div>
        <div class="card-body">
          <div class="btns-contacto" id="btns-contacto"></div>
        </div>
      </div>


    </aside>

    <!-- Main: Galería -->
    <main class="main" id="main-galeria" style="display:none">
      <div class="sec-titulo">
        🛍 Productos
        <div class="sec-titulo-line"></div>
      </div>
      <div class="galeria-grid" id="galeria-grid"></div>
    </main>

  </div><!-- /layout -->

</div><!-- /pagina -->

<!-- Modal Info Tienda -->
<div class="info-overlay" id="info-overlay" onclick="cerrarInfoOverlay(event)">
  <div class="info-sheet" id="info-sheet">
    <div class="info-sheet-handle"></div>
    <div class="info-sheet-header">
      <span style="font-size:20px">🏪</span>
      <div class="info-sheet-title" id="is-nombre">—</div>
      <button class="info-sheet-close" onclick="cerrarInfo()">✕</button>

    <div class="info-sheet-body" id="info-sheet-body"></div>
  </div>
</div>

<!-- Modal Producto -->
<div class="overlay" id="overlay" onclick="cerrarOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-img-wrap">
      <img id="m-img" class="modal-img-main" src="" alt="" />
      <button class="modal-cerrar" onclick="cerrarModal()">✕</button>
    </div>
    <div id="m-thumbs" class="modal-thumbs" style="display:none"></div>
    <div class="modal-body">
      <div class="modal-nombre"  id="m-nombre"></div>
      <div class="modal-precios" id="m-precios"></div>
      <div id="m-desc-wrap" style="display:none">
        <div class="modal-sep"></div>
        <div class="modal-desc" id="m-desc"></div>
      </div>
      <div class="modal-wa" id="m-wa" style="display:none">
        <a id="m-wa-btn" href="#" target="_blank" class="btn-wa-modal">
          💬 Consultar por WhatsApp
        </a>
        <div class="modal-nota">Te conecta directamente con la tienda</div>
      </div>
    </div>
  </div>
</div>

<!-- Banner Descarga -->
<div class="banner">
  <div class="banner-logo">💰</div>
  <div class="banner-txt">
    <div class="banner-t1">Descarga CashCach</div>
    <div class="banner-t2">Tasa BCV · Calculadora · Directorio completo</div>
  </div>
  <div class="banner-btns">
    <a href="https://play.google.com/store/apps/details?id=com.cashcach" target="_blank" class="banner-btn banner-btn-android">▶ Android</a>
    <a href="https://apps.apple.com/app/cashcach" target="_blank" class="banner-btn banner-btn-ios"> iOS</a>
  </div>
</div>

      whatsapp: '58412000000',
      telefono: '02120000000',
      web: 'cashcach.com',
      direccion: 'Av. Principal, Local 5, Las Mercedes',
      descripcion: 'Somos una tienda de electrónica y accesorios con más de 10 años en el mercado. Trabajamos con las mejores marcas y ofrecemos precios en dólares y bolívares al cambio BCV.',
    },
    galeria: [
      { titulo: 'iPhone 15 Pro', precio: '999', precio_bs: '36450', imagen: '', descripcion: 'iPhone 15 Pro 256GB Titanio Natural. Garantía oficial 1 año.' },
      { titulo: 'Samsung Galaxy S24', precio: '799', precio_bs: '29163', imagen: '', descripcion: 'Samsung Galaxy S24 128GB. Sellado, garantía 1 año.' },
      { titulo: 'AirPods Pro 2', precio: '249', precio_bs: '9087', imagen: '' },
      { titulo: 'Cargador 65W GaN', precio: '35', precio_bs: '1278', imagen: '' },
      { titulo: 'Cable USB-C 2m', precio: '12', precio_bs: '438', imagen: '' },
      { titulo: 'Funda iPhone 15', precio: '18', precio_bs: '657', imagen: '' },
    ],
  };

  async function cargar() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return mostrarError('Link inválido', 'Falta el ID de la tienda.');

    let s, galeria;

    if (id === 'demo') {
      s = DEMO.s;
      galeria = DEMO.galeria;
    } else {
      const [r1, r2] = await Promise.all([
        db.from('socios_comerciales').select('*').eq('id', id).single(),
        db.from('galeria_items').select('*').eq('socio_id', id).order('orden'),
      ]);
      s = r1.data;
      galeria = r2.data;
    }

    if (!s) return mostrarError('Tienda no encontrada', 'Este link ya no está disponible.');

    _waGlobal  = s.whatsapp;
    _socioData = s;
    document.getElementById('btn-info').style.display = 'flex';

    // Meta OG
    document.title = `${s.nombre} · CashCach`;
    document.getElementById('og-title').content       = s.nombre;
    document.getElementById('og-description').content = s.descripcion ?? `${s.nombre} en CashCach · ${s.ciudad ?? ''}`;
    if (s.imagen) document.getElementById('og-image').content = s.imagen;

    // Topbar
    document.getElementById('top-nombre').textContent = s.nombre;
    if (s.destacado) document.getElementById('top-dest').style.display = 'flex';

    // Hero
    const hero = document.getElementById('hero');
    hero.innerHTML = `
      ${s.imagen
        ? `<img class="hero-img" src="${s.imagen}" alt="${s.nombre}" />`
        : `<div class="hero-placeholder">🏪</div>`}
      <div class="hero-grad"></div>
      <div class="hero-content">
        <div class="hero-nombre">${s.nombre}</div>
        <div class="hero-tags">
          ${s.destacado ? `<span class="hero-tag hero-tag-dest">⭐ Destacada</span>` : ''}
          ${s.ciudad    ? `<span class="hero-tag">📍 ${s.ciudad}</span>` : ''}
          ${s.plan && s.plan !== 'gratis'
            ? `<span class="hero-tag">✦ Plan ${s.plan.charAt(0).toUpperCase()+s.plan.slice(1)}</span>` : ''}
        </div>
      </div>`;

    // Botones contacto
    const btns = document.getElementById('btns-contacto');
    let hayContacto = false;
    if (s.whatsapp) { btns.innerHTML += `<a class="btn-c btn-wa" href="https://wa.me/${s.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`; hayContacto = true; }
    if (s.telefono) { btns.innerHTML += `<a class="btn-c btn-tel" href="tel:${s.telefono.replace(/\D/g,'')}" target="_blank">📞 Llamar</a>`; hayContacto = true; }
    if (s.web)      { btns.innerHTML += `<a class="btn-c btn-web" href="${s.web.startsWith('http') ? s.web : 'https://'+s.web}" target="_blank">🌐 Ver web / redes</a>`; hayContacto = true; }
    if (hayContacto) document.getElementById('card-contacto').style.display = 'block';

    // Galería
    if (galeria?.length) {
      const grid = document.getElementById('galeria-grid');
      galeria.forEach(item => {
        const imgs = [item.imagen, item.imagen2, item.imagen3].filter(Boolean);
        const div = document.createElement('div');
        div.className = 'prod-card';
        div.onclick = () => abrirProducto(item);
        div.innerHTML = `
          <div class="prod-img-wrap">
            ${item.imagen
              ? `<img class="prod-img" src="${item.imagen}" alt="${item.titulo ?? ''}" loading="lazy" />`
              : `<div class="prod-placeholder">📦</div>`}
            ${imgs.length > 1 ? `<div class="prod-badge-imgs">+${imgs.length} fotos</div>` : ''}
          </div>
          <div class="prod-info">
            ${item.titulo ? `<div class="prod-nombre">${item.titulo}</div>` : ''}
            ${item.precio
              ? `<div class="prod-precio">$${item.precio}</div>
                 ${item.precio_bs ? `<div class="prod-precio-bs">Bs. ${Number(item.precio_bs).toLocaleString('es-VE')}</div>` : ''}`
              : `<div class="prod-sin-precio">Consultar precio</div>`}
          </div>`;
        grid.appendChild(div);
      });
      document.getElementById('main-galeria').style.display = 'block';
    }

    // Mostrar página
    document.getElementById('loading').style.display = 'none';
    document.getElementById('pagina').style.display  = 'block';
  }

  function abrirProducto(item) {
    const imgs = [item.imagen, item.imagen2, item.imagen3].filter(Boolean);

    // Imagen principal
    const imgEl = document.getElementById('m-img');
    imgEl.src = imgs[0] ?? '';

    // Miniaturas
    const thumbs = document.getElementById('m-thumbs');
    if (imgs.length > 1) {
      thumbs.style.display = 'flex';
      thumbs.innerHTML = imgs.map((src, i) =>
        `<img class="modal-thumb${i===0?' on':''}" src="${src}"
          onclick="setImg('${src}',this)" />`
      ).join('');
    } else { thumbs.style.display = 'none'; }

    // Nombre
    document.getElementById('m-nombre').textContent = item.titulo ?? 'Producto';

    // Precios
    const prEl = document.getElementById('m-precios');
    if (item.precio) {
      prEl.innerHTML = `<div class="modal-precio">$${item.precio}</div>
        ${item.precio_bs ? `<div class="modal-precio-bs">Bs. ${Number(item.precio_bs).toLocaleString('es-VE')}</div>` : ''}`;
    } else {
      prEl.innerHTML = `<div style="font-size:14px;color:var(--muted);font-style:italic">Consultar precio</div>`;
    }

    // Descripción
    const dw = document.getElementById('m-desc-wrap');
    if (item.descripcion) {
      document.getElementById('m-desc').textContent = item.descripcion;
      dw.style.display = 'block';
    } else { dw.style.display = 'none'; }

    // WhatsApp
    const waWrap = document.getElementById('m-wa');
    if (_waGlobal) {
      const msg = encodeURIComponent(`Hola! Me interesa: *${item.titulo ?? 'el producto'}*${item.precio ? ' ($'+item.precio+')' : ''}`);
      document.getElementById('m-wa-btn').href = `https://wa.me/${_waGlobal.replace(/\D/g,'')}?text=${msg}`;
      waWrap.style.display = 'flex';
    } else { waWrap.style.display = 'none'; }

    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function setImg(src, el) {
    document.getElementById('m-img').src = src;
    document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
  }

  function cerrarModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function cerrarOverlay(e) {
    if (e.target === document.getElementById('overlay')) cerrarModal();
  }

  function abrirInfo() {
    const s = _socioData;
    if (!s) return;
    document.getElementById('is-nombre').textContent = s.nombre;

    let html = '';

    // Contacto
    const hayContacto = s.whatsapp || s.telefono || s.web;
    if (hayContacto) {
      html += `<div><div class="info-sec-label">Contactar</div><div class="info-sheet-btns">`;
      if (s.whatsapp) html += `<a class="btn-c btn-wa" href="https://wa.me/${s.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`;
      if (s.telefono) html += `<a class="btn-c btn-tel" href="tel:${s.telefono.replace(/\D/g,'')}" target="_blank">📞 Llamar</a>`;
      if (s.web)      html += `<a class="btn-c btn-web" href="${s.web.startsWith('http')?s.web:'https://'+s.web}" target="_blank">🌐 Ver web / redes</a>`;
      html += `</div></div>`;
      if (s.direccion || s.ciudad || s.descripcion) html += `<div class="info-sheet-sep"></div>`;
    }

    // Info
    if (s.direccion || s.ciudad) {
      html += `<div><div class="info-sec-label">Información</div>`;
      if (s.direccion) {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.direccion+(s.ciudad?', '+s.ciudad:''))}`;
        html += `<div class="info-sheet-row">
          <span class="info-sheet-icon">📌</span>
          <div><div class="info-sheet-lbl">Dirección</div>
          <div class="info-sheet-val">${s.direccion}</div></div>
        </div>
        <a class="btn-maps" href="${mapsUrl}" target="_blank" style="margin-top:10px">
          📍 Ver en Google Maps
        </a>`;
      }
      if (s.ciudad) html += `<div class="info-sheet-row">
        <span class="info-sheet-icon">🏙</span>
        <div><div class="info-sheet-lbl">Ciudad</div><div class="info-sheet-val">${s.ciudad}</div></div>
      </div>`;
      html += `</div>`;
      if (s.descripcion) html += `<div class="info-sheet-sep"></div>`;
    }

    // Descripción
    if (s.descripcion) {
      html += `<div><div class="info-sec-label">Sobre el negocio</div>
        <p class="info-sheet-desc">${s.descripcion}</p>
      </div>`;
    }

    document.getElementById('info-sheet-body').innerHTML = html;
    document.getElementById('info-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function cerrarInfo() {
    document.getElementById('info-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function cerrarInfoOverlay(e) {
    if (e.target === document.getElementById('info-overlay')) cerrarInfo();
  }

  function mostrarError(titulo, sub) {
    document.getElementById('loading').innerHTML = `
      <div class="estado-icono">🏪</div>
      <div class="estado-titulo">${titulo}</div>
      <div class="estado-sub">${sub}</div>`;
  }

  cargar();
</script>
</body>
</html>
