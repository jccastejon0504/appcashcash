<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>CashCach · Tienda</title>
  <meta id="og-title"       property="og:title"       content="Tienda en CashCach" />
  <meta id="og-description" property="og:description" content="Descubre esta tienda en CashCach" />
  <meta id="og-image"       property="og:image"       content="" />
  <meta property="og:type"  content="website" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:   #6c3fc5;
      --accent-l: #8b5cf6;
      --bg:       #f7f8fa;
      --card:     #ffffff;
      --border:   #eaecf0;
      --text:     #111827;
      --muted:    #6b7280;
      --muted2:   #9ca3af;
      --green:    #059669;
      --wa:       #25D366;
      --r:        16px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* ── TOPBAR ─────────────────────────────────── */
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 50;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; overflow: hidden;
    }
    .topbar-logo img { width: 100%; height: 100%; object-fit: cover; }
    .topbar-name { font-size: 17px; font-weight: 800; color: var(--text); }
    .topbar-sub  { font-size: 11px; color: var(--muted); }
    .topbar-badge {
      margin-left: auto; background: #fef3c7; color: #92400e;
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 20px; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }

    /* ── HERO ───────────────────────────────────── */
    .hero {
      position: relative; width: 100%; height: 320px;
      overflow: hidden; background: #1e1040;
    }
    @media (min-width: 600px) { .hero { height: 420px; } }
    .hero-img { width: 100%; height: 100%; object-fit: cover; }
    .hero-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e1040 0%, #6c3fc5 100%);
      font-size: 80px;
    }
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.05) 0%, rgba(0,0,0,.65) 100%);
    }
    .hero-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 20px 20px;
    }
    .hero-nombre {
      font-size: 28px; font-weight: 900; color: #fff;
      line-height: 1.2; margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,.4);
    }
    @media (min-width: 600px) { .hero-nombre { font-size: 36px; } }
    .hero-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .hero-tag {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: #fff; font-weight: 600;
    }
    .hero-tag-dest {
      background: rgba(245,158,11,.85);
      border-color: rgba(245,158,11,.5);
    }

    /* ── LAYOUT ─────────────────────────────────── */
    .layout {
      max-width: 960px; margin: 0 auto;
      padding: 20px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 720px) {
      .layout {
        grid-template-columns: 280px 1fr;
        align-items: start;
      }
    }

    /* ── SIDEBAR ────────────────────────────────── */
    .sidebar { display: flex; flex-direction: column; gap: 14px; }

    /* ── CARD ───────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .card-head {
      padding: 14px 16px 0;
      font-size: 10px; font-weight: 800;
      color: var(--muted2); letter-spacing: 1.2px; text-transform: uppercase;
    }
    .card-body { padding: 12px 16px 16px; }

    /* ── CONTACTO ───────────────────────────────── */
    .btns-contacto { display: flex; flex-direction: column; gap: 8px; }
    .btn-c {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 16px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      text-decoration: none; transition: filter .15s, transform .1s;
    }
    .btn-c:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-c:active { transform: translateY(0); }
    .btn-wa  { background: #2b544d; }
    .btn-tel { background: #2b544d; }
    .btn-web { background: #2b544d; }

    /* ── INFO ROWS ──────────────────────────────── */
    .info-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .info-label { font-size: 10px; color: var(--muted2); font-weight: 600; margin-bottom: 1px; }
    .info-val { font-size: 13px; color: var(--text); font-weight: 500; }

    /* ── DESCRIPCIÓN ────────────────────────────── */
    .desc-text {
      font-size: 14px; color: #374151; line-height: 1.7;
    }

    /* ── MAIN ───────────────────────────────────── */
    .main { display: flex; flex-direction: column; gap: 16px; }

    /* ── SECCIÓN TÍTULO ─────────────────────────── */
    .sec-titulo {
      font-size: 18px; font-weight: 800; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .sec-titulo-line {
      flex: 1; height: 2px;
      background: linear-gradient(to right, var(--border), transparent);
    }

    /* ── GALERÍA ────────────────────────────────── */
    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 480px) { .galeria-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 720px) { .galeria-grid { grid-template-columns: repeat(3, 1fr); } }

    .prod-card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
      position: relative;
    }
    .prod-card:hover {
      box-shadow: 0 12px 32px rgba(108,63,197,.15);
      transform: translateY(-3px);
    }
    .prod-img-wrap { position: relative; overflow: hidden; aspect-ratio: 1; }
    .prod-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform .3s;
    }
    .prod-card:hover .prod-img { transform: scale(1.05); }
    .prod-placeholder {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      font-size: 40px;
    }
    .prod-badge-imgs {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,.5); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px;
    }
    .prod-info { padding: 10px 12px 14px; }
    .prod-nombre {
      font-size: 13px; font-weight: 700; color: var(--text);
      line-height: 1.4; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .prod-precio {
      font-size: 18px; font-weight: 900;
      color: #ffc207; line-height: 1;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .prod-precio-tachado { font-size: 11px; font-weight: 600; color: var(--muted2); text-decoration: line-through; }
    .prod-oferta-badge {
      background: #ef4444; color: #fff; font-size: 9px; font-weight: 800;
      padding: 1px 6px; border-radius: 6px; line-height: 1.6;
    }
    .prod-precio-bs {
      font-size: 11px; color: var(--muted); margin-top: 3px; font-weight: 500;
    }
    .prod-no-aplica { font-size: 10px; color: var(--muted2); font-style: italic; }
    .prod-chips { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
    .prod-chip {
      font-size: 9px; font-weight: 800; color: var(--muted);
      background: #f1f5f9; border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 8px;
    }
    .prod-sin-precio {
      font-size: 12px; color: var(--muted2); font-style: italic;
    }

    /* ── MODAL PRODUCTO ─────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    @media (min-width: 540px) { .overlay { align-items: center; } }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 24px 24px 0 0;
      width: 100%; max-width: 520px;
      max-height: 92vh; overflow-y: auto;
      animation: slideUp .25s ease;
    }
    @media (min-width: 540px) { .modal { border-radius: 24px; } }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    .modal-handle {
      width: 40px; height: 4px; background: #e5e7eb;
      border-radius: 4px; margin: 12px auto 0;
    }
    @media (min-width: 540px) { .modal-handle { display: none; } }

    .modal-img-wrap { position: relative; }
    .modal-img-main {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      background: var(--bg);
    }
    .modal-cerrar {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.45); border: none;
      width: 34px; height: 34px; border-radius: 50%;
      color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-thumbs {
      display: flex; gap: 8px; padding: 10px 16px;
      overflow-x: auto; background: #f9fafb;
      border-bottom: 1px solid var(--border);
    }
    .modal-thumb {
      width: 58px; height: 58px; object-fit: cover;
      border-radius: 10px; cursor: pointer; flex-shrink: 0;
      border: 2.5px solid transparent; transition: border-color .15s;
    }
    .modal-thumb.on { border-color: var(--accent); }
    .modal-body { padding: 18px 18px 24px; }
    .modal-nombre { font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .modal-precios { margin-bottom: 14px; }
    .modal-precio { font-size: 28px; font-weight: 900; color: #ffc207; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .modal-precio-tachado { font-size: 16px; font-weight: 600; color: var(--muted2); text-decoration: line-through; }
    .modal-oferta-badge {
      background: #ef4444; color: #fff; font-size: 12px; font-weight: 800;
      padding: 3px 9px; border-radius: 10px;
    }
    .modal-precio-bs { font-size: 14px; color: var(--muted); margin-top: 2px; }
    .modal-no-aplica { font-size: 12px; color: var(--muted2); font-style: italic; }
    .modal-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .modal-chip {
      font-size: 11px; font-weight: 800; color: var(--muted);
      background: #f1f5f9; border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 10px;
    }
    .modal-sep { height: 1px; background: var(--border); margin: 14px 0; }
    .modal-desc { font-size: 14px; color: #374151; line-height: 1.7; }
    .modal-wa {
      margin-top: 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn-wa-modal {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      background: linear-gradient(135deg, #25D366, #1aaf53);
      color: #fff; border: none; border-radius: 14px;
      padding: 15px; font-size: 15px; font-weight: 800;
      cursor: pointer; text-decoration: none;
      transition: filter .15s;
    }
    .btn-wa-modal:hover { filter: brightness(1.07); }
    .modal-nota {
      text-align: center; font-size: 11px; color: var(--muted2);
    }

    /* ── BTN INFO TOPBAR ────────────────────────── */
    .btn-info {
      margin-left: auto; border: none; cursor: pointer;
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: #2b544d;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(43,84,77,.4);
      transition: box-shadow .2s, transform .15s;
    }
    .btn-info:hover { box-shadow: 0 4px 16px rgba(43,84,77,.55); transform: scale(1.07); }
    .btn-info svg { width: 18px; height: 18px; fill: #fff; }

    /* ── MODAL INFO TIENDA ──────────────────────── */
    .info-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
      z-index: 400;
      align-items: flex-end; justify-content: center;
    }
    .info-overlay.open { display: flex; }
    .info-sheet {
      background: #fff;
      border-radius: 28px 28px 0 0;
      width: 100%; max-width: 520px;
      max-height: 88vh; overflow-y: auto;
      animation: slideUp .28s cubic-bezier(.22,.68,0,1.2);
    }
    @media (min-width: 540px) {
      .info-overlay { align-items: center; }
      .info-sheet { border-radius: 24px; max-height: 80vh; }
    }
    .info-sheet-handle {
      width: 36px; height: 4px; background: #e2e8f0;
      border-radius: 4px; margin: 12px auto 0;
    }
    @media (min-width: 540px) { .info-sheet-handle { display: none; } }

    /* Header con gradiente */
    .info-sheet-header {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 20px 16px;
      background: linear-gradient(135deg, #f5f0ff 0%, #fff 100%);
      border-bottom: 1px solid #ede9fe;
    }
    .info-sheet-icon-wrap {
      width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(108,63,197,.3);
    }
    .info-sheet-title {
      flex: 1;
      font-size: 17px; font-weight: 800; color: var(--text);
      line-height: 1.3;
    }
    .info-sheet-subtitle {
      font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px;
    }
    .info-sheet-close {
      background: #f1f5f9; border: none; border-radius: 50%;
      width: 30px; height: 30px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: background .15s, color .15s; flex-shrink: 0;
    }
    .info-sheet-close:hover { background: #e2e8f0; color: var(--text); }

    /* Body */
    .info-sheet-body { padding: 16px 18px 32px; display: flex; flex-direction: column; gap: 12px; }

    /* Sección bloque */
    .info-sec {
      background: #f8fafc; border-radius: 16px;
      border: 1px solid #e2e8f0; overflow: hidden;
    }
    .info-sec-head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .info-sec-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .info-sec-label {
      font-size: 10px; font-weight: 800; color: var(--muted);
      letter-spacing: 1.2px; text-transform: uppercase;
    }
    .info-sec-body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }

    /* Fila de dato */
    .info-sheet-row {
      display: flex; align-items: flex-start; gap: 12px;
    }
    .info-row-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .info-row-icon.purple { background: #ede9fe; }
    .info-row-icon.blue   { background: #dbeafe; }
    .info-row-icon.red    { background: #fee2e2; }
    .info-row-icon.green  { background: #d1fae5; }
    .info-row-txt { display: flex; flex-direction: column; gap: 2px; justify-content: center; }
    .info-sheet-lbl { font-size: 10px; color: var(--muted2); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
    .info-sheet-val { font-size: 14px; color: var(--text); font-weight: 600; line-height: 1.4; }
    .info-sheet-desc { font-size: 14px; color: #374151; line-height: 1.75; }

    /* Botones en modal */
    .info-sheet-btns { display: flex; flex-direction: column; gap: 8px; }
    .btn-maps {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      text-decoration: none; background: linear-gradient(135deg, #ea4335, #c5221f);
      transition: filter .15s; margin-top: 4px;
    }
    .btn-maps:hover { filter: brightness(1.08); }

    /* ── BANNER DESCARGA ────────────────────────── */
    .banner {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 24px rgba(0,0,0,.1);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      z-index: 100;
    }
    .banner-logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #1e1040, var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0; overflow: hidden;
    }
    .banner-logo img { width: 100%; height: 100%; object-fit: cover; }
    .banner-txt { flex: 1; min-width: 0; }
    .banner-t1 { font-size: 13px; font-weight: 800; color: var(--text); }
    .banner-t2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .banner-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .banner-btn {
      padding: 9px 13px; border-radius: 10px; border: none;
      font-size: 11px; font-weight: 800; cursor: pointer;
      text-decoration: none; display: inline-block; white-space: nowrap;
    }
    .banner-btn-android { background: #2b544d; color: #fff; }
    .banner-btn-ios     { background: #111827; color: #fff; }

    /* ── ESTADO ─────────────────────────────────── */
    .estado {
      min-height: 50vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: var(--muted); text-align: center;
      padding: 24px;
    }
    .estado-icono { font-size: 56px; }
    .estado-titulo { font-size: 18px; font-weight: 700; color: var(--text); }
    .estado-sub { font-size: 14px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ────────────────────────────── */
    .empty-galeria {
      text-align: center; padding: 40px 20px;
      color: var(--muted2); font-size: 14px;
    }

    /* scrollbar mínima */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── HERO LIGHTBOX ──────────────────────────── */
    .hero-lb {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.95);
      z-index: 600;
      align-items: center; justify-content: center;
      touch-action: none;
    }
    .hero-lb.open { display: flex; }
    .hero-lb-img {
      max-width: 100%; max-height: 100vh;
      object-fit: contain;
      transform-origin: center center;
      user-select: none; -webkit-user-select: none;
      will-change: transform;
    }
    .hero-lb-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,.15); border: none;
      width: 38px; height: 38px; border-radius: 50%;
      color: #fff; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-img-btn {
      cursor: zoom-in; display: block; width: 100%; height: 100%;
    }
  </style>
</head>
<body>

<!-- Loading state inicial -->
<div id="loading" class="estado" style="min-height:100vh">
  <div class="spinner"></div>
  <div class="estado-sub">Cargando tienda…</div>
</div>

<!-- Página principal (oculta hasta cargar) -->
<div id="pagina" style="display:none">

  <!-- Topbar -->
  <div class="topbar" id="topbar">
    <div class="topbar-logo" id="topbar-logo">💰</div>
    <div>
      <div class="topbar-name" id="top-nombre">—</div>
      <div class="topbar-sub">CashCach · Directorio de Tiendas</div>

<script>
  const SUPABASE_URL = 'https://mvbkyducdlajoexawbqk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Ymt5ZHVjZGxham9leGF3YnFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NjAyNTgsImV4cCI6MjA5MjEzNjI1OH0.-kSTyl1KhfAa9N13PjOObwWz1Gi83KT3_6TeyTY7LlY';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let _waGlobal  = null;
  let _socioData = null;
  let _promo     = null;
  let _metodos   = [];
  let _tasas     = { usd: null, eur: null, usdt: null };

  /* ── Promociones / métodos de pago (mismo modelo que la app nativa) ── */

  // % de descuento que le toca a un producto según la promo activa de la
  // tienda. `metodo` permite consultar si ESE método específico está
  // habilitado para el descuento de categoría; sin `metodo` alcanza con que
  // al menos un método esté habilitado. Pago Móvil y Transferencia se tratan
  // como un solo método "bs".
  function descuentoProductoPct(item, promo, metodo) {
    if (!promo) return 0;
    const esBs = metodo === 'pago_movil' || metodo === 'transferencia';
    if (promo.tipo_activo === 'todos') {
      if (esBs) return 0;
      return promo.descuento_todos_pct || 0;
    }
    if (promo.tipo_activo === 'categoria' && item.categoria_id) {
      const d = (promo.descuentos_categoria || []).find(d => d.categoria_id === item.categoria_id && d.activo);
      if (!d) return 0;
      const metodosActivos = d.metodos ?? ['zelle', 'usdt'];
      if (metodo) {
        const clave = esBs ? 'bs' : metodo;
        return metodosActivos.includes(clave) ? (d.pct || 0) : 0;
      }
      return metodosActivos.length > 0 ? (d.pct || 0) : 0;
    }
    return 0;
  }

  function precioConDescuento(precio, pct) {
    const p = parseFloat(precio);
    if (isNaN(p)) return null;
    if (pct <= 0) return p;
    return +(p * (1 - pct / 100)).toFixed(2);
  }

  // Tasa BCV (oficial), EUR y la "paralela" (la que de hecho sigue el P2P
  // de USDT en Venezuela), mismas fuentes que usa la app nativa.
  async function obtenerTasas() {
    const t = { usd: null, eur: null, usdt: null };
    try {
      const r = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
      const d = await r.json();
      t.usd = parseFloat(d.promedio ?? d.promedio_real) || null;
    } catch {}
    try {
      const r = await fetch('https://ve.dolarapi.com/v1/dolares/paralelo');
      const d = await r.json();
      t.usdt = parseFloat(d.promedio ?? d.promedio_real) || null;
    } catch {}
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/USD');
      const d = await r.json();
      if (!t.usd) t.usd = parseFloat(d?.rates?.VES) || null;
      const eurPorUsd = parseFloat(d?.rates?.EUR) || 0;
      if (t.usd && eurPorUsd > 0) t.eur = t.usd / eurPorUsd;
    } catch {}
    return t;
  }

  function tieneMetodo(tipo) { return _metodos.some(m => m.tipo === tipo); }

  function metodoBsGlobalPct() {
    const m = _metodos.find(m => (m.tipo === 'pago_movil' || m.tipo === 'transferencia') && m.oferta_activa);
    return m ? (m.oferta_pct || 0) : 0;
  }

  // Tasa a usar para el Bs "genérico" (sin método de pago elegido, como en
  // esta página): prioridad $ efectivo (USD/BCV) > € (EUR/BCV) > USDT
  // (paralela) > USD/BCV por defecto.
  function tasaGenerica() {
    if (tieneMetodo('efectivo')) return _tasas.usd;
    if (tieneMetodo('euro'))     return _tasas.eur;
    if (tieneMetodo('usdt'))     return _tasas.usdt;
    return _tasas.usd;
  }

  function bsDesdeUsd(precioUsd, precioBsGuardado, pct) {
    const usd = parseFloat(precioUsd);
    const tasa = tasaGenerica();
    if (tasa != null && !isNaN(usd)) return precioConDescuento(String(usd * tasa), pct);
    if (precioBsGuardado) { const v = parseFloat(precioBsGuardado); return isNaN(v) ? null : v; }
    return null;
  }

  // Arma el bloque de precio ($ con oferta + Bs + chips de métodos),
  // reutilizado tanto en la tarjeta de la grilla como en el modal del
  // producto. `tam` es 'grid' (por defecto) o 'modal'.
  function precioBloqueHtml(item, tam) {
    if (!item.precio) {
      return tam === 'modal'
        ? `<div style="font-size:14px;color:var(--muted);font-style:italic">Consultar precio</div>`
        : `<div class="prod-sin-precio">Consultar precio</div>`;
    }

    const cls = tam === 'modal'
      ? { precio: 'modal-precio', tachado: 'modal-precio-tachado', badge: 'modal-oferta-badge',
          bs: 'modal-precio-bs', noAplica: 'modal-no-aplica', chips: 'modal-chips', chip: 'modal-chip' }
      : { precio: 'prod-precio', tachado: 'prod-precio-tachado', badge: 'prod-oferta-badge',
          bs: 'prod-precio-bs', noAplica: 'prod-no-aplica', chips: 'prod-chips', chip: 'prod-chip' };

    const descPct    = descuentoProductoPct(item, _promo);
    const precioDesc = descPct > 0 ? precioConDescuento(item.precio, descPct) : null;
    const pctBs       = Math.max(metodoBsGlobalPct(), descuentoProductoPct(item, _promo, 'pago_movil'));
    const precioBs     = bsDesdeUsd(item.precio, item.precio_bs, pctBs);
    const efectivoElegible = descuentoProductoPct(item, _promo, 'efectivo') > 0;
    const zelleElegible    = descuentoProductoPct(item, _promo, 'zelle') > 0;
    const usdtElegible      = descuentoProductoPct(item, _promo, 'usdt') > 0;

    let html = `<div class="${cls.precio}">$${precioDesc ?? item.precio}`;
    if (precioDesc != null) {
      html += `<span class="${cls.tachado}">$${item.precio}</span><span class="${cls.badge}">-${descPct}%</span>`;
    }
    html += `</div>`;

    const bsMostrado = precioBs ?? (item.precio_bs ? parseFloat(item.precio_bs) : null);
    if (bsMostrado != null) {
      html += `<div class="${cls.bs}">Bs. ${bsMostrado.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      if (precioDesc != null && pctBs <= 0) html += ` &nbsp;<span class="${cls.noAplica}">No aplica oferta</span>`;
      html += `</div>`;
    }

    const chips = [];
    if (precioDesc != null) {
      if (pctBs <= 0) {
        if (tieneMetodo('efectivo') && efectivoElegible) chips.push('$');
        if (tieneMetodo('euro')) chips.push('€');
      } else {
        chips.push('Bs');
      }
      if (tieneMetodo('usdt') && usdtElegible) chips.push('USDT');
      if (tieneMetodo('zelle') && zelleElegible) chips.push('Zelle');
    } else {
      if (tieneMetodo('efectivo')) chips.push('$');
      if (tieneMetodo('euro')) chips.push('€');
      if (tieneMetodo('pago_movil') || tieneMetodo('transferencia')) chips.push('Bs');
      if (tieneMetodo('usdt')) chips.push('USDT');
      if (tieneMetodo('zelle')) chips.push('Zelle');
    }
    if (chips.length) {
      html += `<div class="${cls.chips}">${chips.map(c => `<span class="${cls.chip}">${c}</span>`).join('')}</div>`;
    }
    return html;
  }

  const DEMO = {
    s: {
      nombre: 'Tienda Demo · CashCach',
      imagen: '',
      destacado: true,
      ciudad: 'Caracas',
      plan: 'premium',
      whatsapp: '58412000000',
      telefono: '02120000000',
      web: 'cashcach.com',
      direccion: 'Av. Principal, Local 5, Las Mercedes',
      descripcion: 'Somos una tienda de electrónica y accesorios con más de 10 años en el mercado. Trabajamos con las mejores marcas y ofrecemos precios en dólares y bolívares al cambio BCV.',
    },
    galeria: [
      { titulo: 'iPhone 15 Pro', precio: '999', precio_bs: '36450', imagen: '', descripcion: 'iPhone 15 Pro 256GB Titanio Natural. Garantía oficial 1 año.' },
      { titulo: 'Samsung Galaxy S24', precio: '799', precio_bs: '29163', imagen: '', descripcion: 'Samsung Galaxy S24 128GB. Sellado, garantía 1 año.' },
      { titulo: 'AirPods Pro 2', precio: '249', precio_bs: '9087', imagen: '' },
      { titulo: 'Cargador 65W GaN', precio: '35', precio_bs: '1278', imagen: '' },
      { titulo: 'Cable USB-C 2m', precio: '12', precio_bs: '438', imagen: '' },
      { titulo: 'Funda iPhone 15', precio: '18', precio_bs: '657', imagen: '' },
    ],
  };

  async function cargar() {
    const id = new URLSearchParams(location.search).get('id');
    if (!id) return mostrarError('Link inválido', 'Falta el ID de la tienda.');

    let s, galeria;

    if (id === 'demo') {
      s = DEMO.s;
      galeria = DEMO.galeria;
    } else {
      const [r1, r2, r3, r4, tasas] = await Promise.all([
        db.from('socios_comerciales').select('*').eq('id', id).single(),
        db.from('galeria_items').select('*').eq('socio_id', id).order('orden'),
        db.from('promociones_tienda').select('*').eq('tienda_id', id).maybeSingle(),
        db.from('metodos_pago_tienda').select('tipo, oferta_activa, oferta_pct').eq('tienda_id', id).eq('activo', true),
        obtenerTasas(),
      ]);
      s = r1.data;
      galeria = r2.data;
      _promo = r3.data;
      _metodos = r4.data ?? [];
      _tasas = tasas;
    }

    if (!s) return mostrarError('Tienda no encontrada', 'Este link ya no está disponible.');

    _waGlobal  = s.whatsapp;
    _socioData = s;
    document.getElementById('btn-info').style.display = 'flex';

    // Meta OG
    document.title = `${s.nombre} · CashCach`;
    document.getElementById('og-title').content       = s.nombre;
    document.getElementById('og-description').content = s.descripcion ?? `${s.nombre} en CashCach · ${s.ciudad ?? ''}`;
    if (s.imagen) document.getElementById('og-image').content = s.imagen;

    // Topbar
    document.getElementById('top-nombre').textContent = s.nombre;
    if (s.destacado) document.getElementById('top-dest').style.display = 'flex';
    if (s.logo) {
      document.getElementById('topbar-logo').innerHTML = `<img src="${s.logo}" alt="${s.nombre}" />`;
    }

    // Hero
    const hero = document.getElementById('hero');
    hero.innerHTML = `
      ${s.imagen
        ? `<img class="hero-img hero-img-btn" src="${s.imagen}" alt="${s.nombre}" onclick="abrirHeroImg()" />`
        : `<div class="hero-placeholder">🏪</div>`}
      <div class="hero-grad"></div>
      <div class="hero-content">
        <div class="hero-nombre">${s.nombre}</div>
        <div class="hero-tags">
          ${s.destacado ? `<span class="hero-tag hero-tag-dest">⭐ Destacada</span>` : ''}
          ${s.ciudad    ? `<span class="hero-tag">📍 ${s.ciudad}</span>` : ''}
        </div>
      </div>`;

    // Botones contacto
    const btns = document.getElementById('btns-contacto');
    let hayContacto = false;
    if (s.whatsapp) { btns.innerHTML += `<a class="btn-c btn-wa" href="https://wa.me/${s.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`; hayContacto = true; }
    if (s.telefono) { btns.innerHTML += `<a class="btn-c btn-tel" href="tel:${s.telefono.replace(/\D/g,'')}" target="_blank">📞 Llamar</a>`; hayContacto = true; }
    if (s.web)      { btns.innerHTML += `<a class="btn-c btn-web" href="${s.web.startsWith('http') ? s.web : 'https://'+s.web}" target="_blank">🌐 Ver web / redes</a>`; hayContacto = true; }
    if (hayContacto) document.getElementById('card-contacto').style.display = 'block';

    // Galería
    if (galeria?.length) {
      const grid = document.getElementById('galeria-grid');
      galeria.forEach(item => {
        const imgs = [item.imagen, item.imagen2, item.imagen3].filter(Boolean);
        const div = document.createElement('div');
        div.className = 'prod-card';
        div.onclick = () => abrirProducto(item);
        div.innerHTML = `
          <div class="prod-img-wrap">
            ${item.imagen
              ? `<img class="prod-img" src="${item.imagen}" alt="${item.titulo ?? ''}" loading="lazy" />`
              : `<div class="prod-placeholder">📦</div>`}
            ${imgs.length > 1 ? `<div class="prod-badge-imgs">+${imgs.length} fotos</div>` : ''}
          </div>
          <div class="prod-info">
            ${item.titulo ? `<div class="prod-nombre">${item.titulo}</div>` : ''}
            ${precioBloqueHtml(item)}
          </div>`;
        grid.appendChild(div);
      });
      document.getElementById('main-galeria').style.display = 'block';
    }

    // Mostrar página
    document.getElementById('loading').style.display = 'none';
    document.getElementById('pagina').style.display  = 'block';

    // Si el link trae un producto específico (?p=), abrirlo directamente
    const productoId = new URLSearchParams(location.search).get('p');
    if (productoId && galeria?.length) {
      const item = galeria.find(g => g.id === productoId);
      if (item) abrirProducto(item);
    }
  }

  function abrirProducto(item) {
    const imgs = [item.imagen, item.imagen2, item.imagen3].filter(Boolean);

    // Imagen principal
    const imgEl = document.getElementById('m-img');
    imgEl.src = imgs[0] ?? '';

    // Miniaturas
    const thumbs = document.getElementById('m-thumbs');
    if (imgs.length > 1) {
      thumbs.style.display = 'flex';
      thumbs.innerHTML = imgs.map((src, i) =>
        `<img class="modal-thumb${i===0?' on':''}" src="${src}"
          onclick="setImg('${src}',this)" />`
      ).join('');
    } else { thumbs.style.display = 'none'; }

    // Nombre
    document.getElementById('m-nombre').textContent = item.titulo ?? 'Producto';

    // Precios
    document.getElementById('m-precios').innerHTML = precioBloqueHtml(item, 'modal');

    // Descripción
    const dw = document.getElementById('m-desc-wrap');
    if (item.descripcion) {
      document.getElementById('m-desc').textContent = item.descripcion;
      dw.style.display = 'block';
    } else { dw.style.display = 'none'; }

    // WhatsApp
    const waWrap = document.getElementById('m-wa');
    if (_waGlobal) {
      const descPctWa   = descuentoProductoPct(item, _promo);
      const precioWa    = descPctWa > 0 ? precioConDescuento(item.precio, descPctWa) : item.precio;
      const msg = encodeURIComponent(`Hola! Me interesa: *${item.titulo ?? 'el producto'}*${precioWa ? ' ($'+precioWa+')' : ''}`);
      document.getElementById('m-wa-btn').href = `https://wa.me/${_waGlobal.replace(/\D/g,'')}?text=${msg}`;
      waWrap.style.display = 'flex';
    } else { waWrap.style.display = 'none'; }

    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function setImg(src, el) {
    document.getElementById('m-img').src = src;
    document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
  }

  function cerrarModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function cerrarOverlay(e) {
    if (e.target === document.getElementById('overlay')) cerrarModal();

  function abrirInfo() {
    const s = _socioData;
    if (!s) return;
    document.getElementById('is-nombre').textContent = s.nombre;

    let html = '';

    // Descripción
    if (s.descripcion) {
      html += `<div class="info-sec">
        <div class="info-sec-head"><div class="info-sec-dot"></div><div class="info-sec-label">Sobre el negocio</div></div>
        <div class="info-sec-body"><p class="info-sheet-desc">${s.descripcion}</p></div>
      </div>`;
    }

    // Info
    if (s.direccion || s.ciudad) {
      let rowsHtml = '';
      if (s.direccion) {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.direccion+(s.ciudad?', '+s.ciudad:''))}`;
        rowsHtml += `<div class="info-sheet-row">
          <div class="info-row-icon purple">📌</div>
          <div class="info-row-txt">
            <div class="info-sheet-lbl">Dirección</div>
            <div class="info-sheet-val">${s.direccion}</div>
          </div>
        </div>
        <a class="btn-maps" href="${mapsUrl}" target="_blank">📍 Ver en Google Maps</a>`;
      }
      if (s.ciudad) {
        rowsHtml += `<div class="info-sheet-row">
          <div class="info-row-icon blue">🏙</div>
          <div class="info-row-txt">
            <div class="info-sheet-lbl">Ciudad</div>
            <div class="info-sheet-val">${s.ciudad}</div>
          </div>
        </div>`;
      }
      html += `<div class="info-sec">
        <div class="info-sec-head"><div class="info-sec-dot"></div><div class="info-sec-label">Información</div></div>
        <div class="info-sec-body">${rowsHtml}</div>
      </div>`;
    }

    // Contacto
    const hayContacto = s.whatsapp || s.telefono || s.web;
    if (hayContacto) {
      let btnsHtml = '';
      if (s.whatsapp) btnsHtml += `<a class="btn-c btn-wa" href="https://wa.me/${s.whatsapp.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`;
      if (s.telefono) btnsHtml += `<a class="btn-c btn-tel" href="tel:${s.telefono.replace(/\D/g,'')}" target="_blank">📞 Llamar</a>`;
      if (s.web)      btnsHtml += `<a class="btn-c btn-web" href="${s.web.startsWith('http')?s.web:'https://'+s.web}" target="_blank">🌐 Ver web / redes</a>`;
      html += `<div class="info-sec">
        <div class="info-sec-head"><div class="info-sec-dot"></div><div class="info-sec-label">Contactar</div></div>
        <div class="info-sec-body"><div class="info-sheet-btns">${btnsHtml}</div></div>
      </div>`;
    }

    document.getElementById('info-sheet-body').innerHTML = html;
    document.getElementById('info-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function cerrarInfo() {
    document.getElementById('info-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function cerrarInfoOverlay(e) {
    if (e.target === document.getElementById('info-overlay')) cerrarInfo();
  }

  /* ── HERO LIGHTBOX + PINCH ZOOM ─────────────── */
  function abrirHeroImg() {
    if (!_socioData?.imagen) return;
    const lb  = document.getElementById('hero-lb');
    const img = document.getElementById('hero-lb-img');
    img.src = _socioData.imagen;
    img.style.transform = '';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    initHeroPinch(img);
  }

  function cerrarHeroLb(e) {
    if (e && e.target !== document.getElementById('hero-lb') &&
        !e.target.classList.contains('hero-lb-close')) return;
    document.getElementById('hero-lb').classList.remove('open');
    document.getElementById('hero-lb-img').style.transform = '';
    document.body.style.overflow = '';
  }

  function initHeroPinch(img) {
    let scale = 1, baseScale = 1;
    let tx = 0, ty = 0;
    let startDist = 0, startScale = 1;
    let startTx = 0, startTy = 0, startMidX = 0, startMidY = 0;

    function getTouches(e) { return Array.from(e.touches); }
    function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

    img.ontouchstart = (e) => {
      e.preventDefault();
      const t = getTouches(e);
      if (t.length === 2) {
        startDist  = dist(t[0], t[1]);
        startScale = scale;
        startMidX  = (t[0].clientX + t[1].clientX) / 2;
        startMidY  = (t[0].clientY + t[1].clientY) / 2;
        startTx = tx; startTy = ty;
      }
    };
    img.ontouchmove = (e) => {
      e.preventDefault();
      const t = getTouches(e);
      if (t.length === 2) {
        const d = dist(t[0], t[1]);
        scale = Math.max(1, Math.min(6, startScale * (d / startDist)));
        img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
      }
    };
    img.ontouchend = (e) => {
      e.preventDefault();
      if (scale <= 1) {
        scale = 1; baseScale = 1; tx = 0; ty = 0;
        img.style.transform = '';
      } else {
        baseScale = scale;
      }
    };
  }

  function mostrarError(titulo, sub) {
    document.getElementById('loading').innerHTML = `
      <div class="estado-icono">🏪</div>
      <div class="estado-titulo">${titulo}</div>
      <div class="estado-sub">${sub}</div>`;
  }

  cargar();
</script>
