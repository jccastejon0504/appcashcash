<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashCach – Buscando tienda…</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f4f4f5; }
    .logo { font-size: 28px; font-weight: 900; color: #FB8C50; margin-bottom: 12px; }
    .msg  { color: #555; font-size: 15px; }
    .err  { color: #ef4444; font-size: 14px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="logo">CashCach</div>
  <p class="msg" id="msg">Buscando tienda…</p>
  <p class="err" id="err">Esta tienda no está disponible o el link ha cambiado. <br><a href="https://appcashcash.com" style="color:#FB8C50">Ir al inicio</a></p>

  <script>
    const SUPABASE_URL = 'https://mvbkyducdlajoexawbqk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Ymt5ZHVjZGxham9leGF3YnFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NjAyNTgsImV4cCI6MjA5MjEzNjI1OH0.-kSTyl1KhfAa9N13PjOObwWz1Gi83KT3_6TeyTY7LlY';

    (async () => {
      // Extraer slug de la ruta: /t/ecomoda → "ecomoda"
      const parts = window.location.pathname.split('/').filter(Boolean);
      const slug  = parts[parts.length - 1];

      if (!slug || slug === 't') {
        document.getElementById('msg').style.display = 'none';
        document.getElementById('err').style.display = 'block';
        return;
      }

      try {
        const res  = await fetch(`${SUPABASE_URL}/rest/v1/socios_comerciales?slug=eq.${encodeURIComponent(slug)}&select=id&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          window.location.replace(`https://appcashcash.com/admin/tienda.html?id=${data[0].id}`);
        } else {
          document.getElementById('msg').style.display = 'none';
          document.getElementById('err').style.display = 'block';
        }
      } catch {
        document.getElementById('msg').style.display = 'none';
        document.getElementById('err').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
