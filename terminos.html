<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Términos y Condiciones · CashCach</title>
  <meta name="description" content="Términos y Condiciones de uso de CashCach." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:   #6c3fc5;
      --accent-l: #8b5cf6;
      --bg:       #f7f8fa;
      --card:     #ffffff;
      --border:   #eaecf0;
      --text:     #111827;
      --muted:    #6b7280;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .topbar-logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-l));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .topbar-titulos { display: flex; flex-direction: column; }
    .topbar-name { font-size: 17px; font-weight: 800; color: var(--text); }
    .topbar-sub  { font-size: 12px; color: var(--muted); }

    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 20px; }

    .intro {
      display: flex; align-items: center; gap: 10px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-radius: 14px; padding: 14px 16px;
      margin-bottom: 20px;
      color: var(--accent); font-weight: 600; font-size: 14px;
    }

    .seccion {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .seccion h2 {
      font-size: 16px; font-weight: 800; margin-bottom: 8px; line-height: 1.4;
    }
    .seccion p {
      font-size: 14px; line-height: 1.7; color: var(--muted); white-space: pre-line;
    }

    .pie {
      text-align: center; margin-top: 24px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted);
    }

    #contenido-loading { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="topbar">

    <div class="topbar-titulos">

  </div>

  </div>

    ];

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function render(texto) {
      const cont = document.getElementById('contenido');
      if (texto) {
        cont.innerHTML = `<div class="seccion"><p>${escapeHtml(texto)}</p></div>`;
      } else {
        cont.innerHTML = SECCIONES_DEFAULT.map(s =>
          `<div class="seccion"><h2>${escapeHtml(s.t)}</h2><p>${escapeHtml(s.c)}</p></div>`
        ).join('');
      }
      document.getElementById('contenido-loading').style.display = 'none';
      cont.style.display = 'block';
    }

    db.from('config_app').select('valor').eq('clave', 'terminos_condiciones').single()
      .then(({ data }) => render(data && data.valor ? data.valor : null))
      .catch(() => render(null));
  </script>
</body>
</html>
